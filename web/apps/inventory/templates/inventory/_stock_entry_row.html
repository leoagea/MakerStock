<li class="list-card__item" id="stock-entry-{{ entry.pk }}">
    <div class="list-card__main">
        {% if show == "drawer" %}
            <a href="{% url 'storage:drawer_detail' entry.drawer.pk %}">{{ entry.drawer.full_path }}</a>
        {% else %}
            <a href="{% url 'components:component_detail' entry.component.pk %}">{{ entry.component.display_name }}</a>
        {% endif %}
        {% if entry.is_low_stock %}<span class="badge badge--low-stock">low stock</span>{% endif %}
    </div>
    <div class="list-card__actions">
        <form hx-post="{% url 'inventory:inventory_quantity' entry.pk %}?show={{ show }}"
              hx-target="#stock-entry-{{ entry.pk }}"
              hx-swap="outerHTML swap:100ms settle:200ms">
            {% csrf_token %}
            <input type="number" name="quantity" value="{{ entry.quantity }}" min="0">
            <button type="submit" class="secondary">Update</button>
        </form>
        <a href="{% url 'inventory:inventory_edit' entry.pk %}">edit</a>
    </div>
</li>
