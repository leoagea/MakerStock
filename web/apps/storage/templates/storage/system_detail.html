{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <a href="{% url 'storage:system_list' %}" class="breadcrumb">← All storage systems</a>
    <h2>{{ system.name }}</h2>
    {% if system.description %}<span class="hint">{{ system.description }}</span>{% endif %}
</div>

<h3>Frames</h3>
<ul class="list-card">
  {% for frame in system.frames.all %}
    <li class="list-card__item">
        <a href="{% url 'storage:frame_detail' frame.pk %}">Frame {{ frame.code }}</a>
    </li>
  {% empty %}
    <li class="list-card__item list-card__item--empty">No frames yet.</li>
  {% endfor %}
</ul>
{% endblock %}
