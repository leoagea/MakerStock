{% extends "storage/_storage_base.html" %}

{% block storage_main %}
<div class="page-header">
    <h2>Storage systems</h2>
</div>
<ul class="list-card">
  {% for system in systems %}
    <li class="list-card__item">
        <a href="{% url 'storage:system_detail' system.pk %}">{{ system.name }}</a>
    </li>
  {% empty %}
    <li class="list-card__item list-card__item--empty">No storage systems yet.</li>
  {% endfor %}
</ul>
{% endblock %}
