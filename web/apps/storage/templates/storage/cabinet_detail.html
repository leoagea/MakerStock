{% extends "base.html" %}

{% block content %}
<p><a href="{% url 'storage:system_detail' cabinet.system.pk %}">{{ cabinet.system.name }}</a></p>
<h2>Cabinet {{ cabinet.code }}</h2>

<h3>Drawers</h3>
<ul>
  {% for drawer in cabinet.drawers.all %}
    <li><a href="{% url 'storage:drawer_detail' drawer.pk %}">Drawer {{ drawer.code }}</a></li>
  {% empty %}
    <li>No drawers yet.</li>
  {% endfor %}
</ul>
{% endblock %}
