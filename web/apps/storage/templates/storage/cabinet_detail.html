{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <a href="{% url 'storage:system_detail' cabinet.system.pk %}" class="breadcrumb">← {{ cabinet.system.name }}</a>
    <h2>Cabinet {{ cabinet.code }}</h2>
</div>

<h3>Drawers</h3>
<ul class="list-card">
  {% for drawer in cabinet.drawers.all %}
    <li class="list-card__item">
        <a href="{% url 'storage:drawer_detail' drawer.pk %}">Drawer {{ drawer.code }}</a>
    </li>
  {% empty %}
    <li class="list-card__item list-card__item--empty">No drawers yet.</li>
  {% endfor %}
</ul>
{% endblock %}
