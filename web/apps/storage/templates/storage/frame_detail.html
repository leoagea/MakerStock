{% extends "base.html" %}

{% block content %}
<p><a href="{% url 'storage:cabinet_detail' frame.cabinet.pk %}">{{ frame.cabinet.full_path }}</a></p>
<h2>Frame {{ frame.code }}</h2>

<h3>Drawers</h3>
<ul>
  {% for drawer in frame.drawers.all %}
    <li><a href="{% url 'storage:drawer_detail' drawer.pk %}">Drawer {{ drawer.code }}</a></li>
  {% empty %}
    <li>No drawers yet.</li>
  {% endfor %}
</ul>
{% endblock %}
