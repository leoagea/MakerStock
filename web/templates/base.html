{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MakerStock{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <script src="{% static 'vendor/htmx.min.js' %}" defer></script>
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="{% url 'home' %}">MakerStock</a></h1>
            <nav>
                <a href="{% url 'components:component_list' %}"
                   class="{% if request.resolver_match.url_name in "component_list,component_detail,component_add,component_edit" %}active{% endif %}">Components</a>
                <a href="{% url 'storage:system_list' %}"
                   class="{% if request.resolver_match.app_name == "storage" %}active{% endif %}">Storage</a>
                <a href="{% url 'components:catalog_admin' %}"
                   class="{% if request.resolver_match.url_name in "catalog_admin,category_edit,manufacturer_edit" %}active{% endif %}">Catalog admin</a>
                {% if user.is_authenticated %}
                    <form method="post" action="{% url 'logout' %}" style="display:inline">
                        {% csrf_token %}
                        <button type="submit">Log out ({{ user.username }})</button>
                    </form>
                {% endif %}
            </nav>
        </div>
    </header>
    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
