{% extends "base.html" %}

{% block content %}
<div class="card auth-card">
    <h2>Log in</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Log in</button>
    </form>
</div>
{% endblock %}
